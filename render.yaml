# Render.com blueprint — two environments from two branches.
# Deploy: https://dashboard.render.com/new -> "Blueprint" -> connect this repo.
#
#   dev  branch -> task-manager-api-dev   (autoDeploy: true  = deploys on every push)
#   test branch -> task-manager-api-test  (autoDeploy: false = you click "Manual Deploy")
#
# Each service is fully isolated: its own DATABASE_URL (use a separate Neon
# database/branch per env) and its own auto-generated JWT_SECRET/APP_ENCRYPTION_KEY.
# Free tier: web services sleep after 15 min idle (~30 s cold start); Neon is
# always-free (use one Neon project with a `dev` and a `test` branch).
services:
  # --- DEV: auto-deploys on push to `dev` ---
  - type: web
    name: task-manager-api-dev
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: dev
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # Set in the dashboard (Environment tab) — point at the Neon *dev* database:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # --- TEST: manual deploy only (autoDeploy: false) ---
  - type: web
    name: task-manager-api-test
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: test
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # Set in the dashboard — point at the Neon *test* database:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
